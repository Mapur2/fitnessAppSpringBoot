spring :
  application :
    name : apigateway
  cloud:
    gateway:
        routes:
          - id: user-service
            uri: lb://user-service #lb means load balancer
            predicates:
              - Path=/api/users/**
            filters:
              - AuthencationFilter

          - id: activity-service
            uri: lb://ACTIVITY-SERVICE
            predicates:
              - Path=/api/activities/**
            filters:
              - AuthencationFilter
          - id: ai-service
            uri: lb://AI-SERVICE
            predicates:
              - Path=/api/recommendations/**
            filters:
              - AuthencationFilter
server:
  port: 8079

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
